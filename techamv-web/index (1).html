<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZypyZape Technologies</title>
    <!-- Cargamos React, ReactDOM y Babel para usar JSX en el navegador -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cargamos Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-in { animation: fade-in 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG ---
        const Icons = {
          Wind: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
          ),
          Leaf: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          ),
          Globe: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          ),
          Send: ({ className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          ),
          Bot: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
          ),
          User: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ),
          Activity: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          ),
          TrendingDown: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
          ),
          DollarSign: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          ),
          Zap: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          ),
          Power: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          ),
          Layers: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 17 22 12"/></svg>
          ),
          Battery: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
          ),
          Settings: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          ),
          Network: ({ className = "w-6 h-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M12 8v4"/></svg>
          )
        };

        function ZypyZapeWeb() {
          const [currentPage, setCurrentPage] = useState('home');
          const [messages, setMessages] = useState([
            {
              role: 'bot',
              text: '¡Hola! Soy el asesor estratégico de ZypyZape. Estoy aquí para hablarte del impacto económico, la entrada en el mercado de regulación, la jubilación nuclear y nuestra tecnología ecológica. ¿En qué te puedo ayudar hoy?'
            }
          ]);
          const [inputText, setInputText] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const messagesEndRef = useRef(null);

          useEffect(() => {
            if (currentPage === 'home') {
              messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }
          }, [messages, currentPage]);

          const handleSendMessage = async (e) => {
            e?.preventDefault();
            if (!inputText.trim() || isTyping) return;

            const userMessage = { role: 'user', text: inputText };
            setMessages(prev => [...prev, userMessage]);
            setInputText('');
            setIsTyping(true);

            try {
              // Simulación de llamada a servidor (Backend) para no exponer la API Key
              const response = await fetch('/api/chat.php', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: inputText })
              });

              if (!response.ok) throw new Error('Error en la comunicación con el servidor');
              
              const data = await response.json();
              const botReply = data.reply || "Lo siento, no pude entender la respuesta del servidor.";
              
              setMessages(prev => [...prev, { role: 'bot', text: botReply }]);
            } catch (error) {
              console.error(error);
              setMessages(prev => [...prev, { role: 'bot', text: "⚠️ Aviso: El chat está desconectado. Para que funcione en producción de forma segura, se debe configurar el endpoint '/api/chat' en el servidor para ocultar la API Key de Gemini." }]);
            } finally {
              setIsTyping(false);
            }
          };

          const NavButton = ({ id, label }) => (
            <button 
              onClick={() => setCurrentPage(id)}
              className={`font-semibold text-xs lg:text-sm transition-all duration-300 pb-2 border-b-2 whitespace-nowrap ${
                currentPage === id 
                  ? 'text-teal-600 border-teal-500' 
                  : 'text-slate-500 border-transparent hover:text-teal-600 hover:border-teal-200'
              }`}
            >
              {label}
            </button>
          );

          // --- RENDERIZADORES DE PÁGINAS ---

          const renderHome = () => (
            <div className="flex flex-col lg:flex-row gap-12 animate-in fade-in duration-700">
              <div className="flex-1 space-y-10">
                <div className="space-y-6">
                  <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-teal-100 text-teal-800 font-bold text-xs uppercase tracking-widest">
                    <span className="w-2 h-2 rounded-full bg-teal-500 animate-pulse" />
                    Visión Estratégica
                  </div>
                  <h1 className="text-5xl md:text-7xl font-black text-slate-900 leading-[1.1] tracking-tight">
                    El Futuro Respira <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-emerald-400">Energía Pura.</span>
                  </h1>
                  <p className="text-lg md:text-xl text-slate-600 leading-relaxed max-w-2xl">
                    ZypyZape transforma la forma en que entendemos el viento. Mediante la optimización de la inercia de fase, pasamos de ser meros espectadores climáticos a ser el corazón que bombea y regula la red eléctrica global.
                  </p>
                </div>

                <div className="grid sm:grid-cols-2 gap-6">
                  <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl transition-shadow duration-300">
                    <div className="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mb-6">
                      <Icons.Globe />
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-3">Impacto Económico</h3>
                    <p className="text-slate-500 text-sm leading-relaxed">
                      Reducimos drásticamente los costes de estabilización y abrimos la puerta al mercado de regulación, multiplicando las vías de ingresos de los parques eólicos.
                    </p>
                  </div>
                  
                  <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl transition-shadow duration-300">
                    <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-6">
                      <Icons.Leaf />
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-3">Jubilación Nuclear</h3>
                    <p className="text-slate-500 text-sm leading-relaxed">
                      ZypyZape proporciona la "Inercia Base" que históricamente justificaba a la energía nuclear. Hacemos posible un ecosistema 100% renovable y seguro.
                    </p>
                  </div>
                </div>
              </div>

              {/* CHATBOT */}
              <div className="w-full lg:w-[450px] flex-shrink-0 flex flex-col bg-white rounded-[2rem] shadow-2xl border border-teal-50 overflow-hidden h-[650px]">
                <div className="bg-gradient-to-r from-teal-500 to-emerald-500 p-6 text-white shrink-0">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center shadow-inner">
                      <Icons.Bot className="w-6 h-6 text-white" />
                    </div>
                    <div>
                      <h2 className="text-lg font-bold">Asesor Corporativo ZypyZape</h2>
                      <p className="text-teal-100 text-xs font-medium flex items-center gap-1">
                        <span className="w-1.5 h-1.5 bg-emerald-300 rounded-full animate-pulse" />
                        Inteligencia Estratégica en línea
                      </p>
                    </div>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50/50">
                  {messages.map((msg, index) => (
                    <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`flex max-w-[85%] gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-auto ${msg.role === 'user' ? 'bg-slate-200 text-slate-600' : 'bg-teal-100 text-teal-600'}`}>
                          {msg.role === 'user' ? <Icons.User className="w-4 h-4" /> : <Icons.Bot className="w-4 h-4" />}
                        </div>
                        <div className={`p-4 rounded-2xl text-[14px] leading-relaxed shadow-sm ${msg.role === 'user' ? 'bg-teal-600 text-white rounded-br-sm' : 'bg-white border border-slate-100 text-slate-700 rounded-bl-sm'}`}>
                          {msg.text}
                        </div>
                      </div>
                    </div>
                  ))}
                  {isTyping && (
                    <div className="flex justify-start">
                      <div className="flex gap-3">
                        <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center shrink-0 mt-auto">
                          <Icons.Bot className="w-4 h-4" />
                        </div>
                        <div className="bg-white border border-slate-100 p-4 rounded-2xl rounded-bl-sm shadow-sm flex items-center gap-1.5">
                          <span className="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }} />
                          <span className="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }} />
                          <span className="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }} />
                        </div>
                      </div>
                    </div>
                  )}
                  <div ref={messagesEndRef} />
                </div>

                <form onSubmit={handleSendMessage} className="p-4 bg-white border-t border-slate-100 shrink-0">
                  <div className="relative flex items-center">
                    <input
                      type="text"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      placeholder="Pregunta sobre mercado, impacto o tecnología..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-full py-4 pl-6 pr-14 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all placeholder:text-slate-400"
                      disabled={isTyping}
                    />
                    <button
                      type="submit"
                      disabled={!inputText.trim() || isTyping}
                      className="absolute right-2 w-10 h-10 bg-teal-500 text-white rounded-full flex items-center justify-center hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-95 shadow-md"
                    >
                      <Icons.Send />
                    </button>
                  </div>
                </form>
              </div>
            </div>
          );

          const renderParadigma = () => (
            <div className="space-y-16 animate-in fade-in duration-700">
              <div className="text-center max-w-4xl mx-auto space-y-6">
                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-100 text-indigo-800 font-bold text-xs uppercase tracking-widest mb-2">
                  Cambio de Reglas de Juego
                </div>
                <h2 className="text-4xl md:text-6xl font-black text-slate-900 leading-tight">
                  De Generador Pasivo a <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-teal-500">Regulador de Red Activo</span>
                </h2>
                <p className="text-xl text-slate-600 leading-relaxed">
                  La industria eólica ha sido históricamente "pasiva": si sopla el viento, se inyecta energía; si no, se apaga. ZypyZape rompe este límite convirtiendo cada molino en una batería de inercia y un escudo para la red.
                </p>
              </div>

              <div className="grid lg:grid-cols-3 gap-8">
                <div className="bg-white p-10 rounded-[2rem] shadow-lg border-t-4 border-slate-800 relative overflow-hidden group hover:-translate-y-2 transition-transform duration-300">
                  <div className="w-14 h-14 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center mb-6 relative z-10">
                    <Icons.Wind />
                  </div>
                  <h3 className="text-2xl font-bold text-slate-900 mb-4 relative z-10">Fin de la Generación Ciega</h3>
                  <p className="text-slate-600 leading-relaxed relative z-10">
                    Los molinos convencionales envían energía sucia y fluctuante, obligando a los operadores a gastar fortunas en filtrarla. Al poseer <strong>Inercia de Fase</strong> nativa, ZypyZape entrega una onda perfecta, sin depender de los vaivenes de las ráfagas.
                  </p>
                </div>

                <div className="bg-white p-10 rounded-[2rem] shadow-lg border-t-4 border-teal-500 relative overflow-hidden group hover:-translate-y-2 transition-transform duration-300">
                  <div className="w-14 h-14 bg-teal-100 text-teal-600 rounded-2xl flex items-center justify-center mb-6 relative z-10">
                    <Icons.Layers />
                  </div>
                  <h3 className="text-2xl font-bold text-slate-900 mb-4 relative z-10">El Lucrativo Mercado de Regulación</h3>
                  <p className="text-slate-600 leading-relaxed relative z-10">
                    Hoy en día, las eléctricas ganan grandes márgenes no solo por vender MWh, sino por ofrecer "Servicios Auxiliares" (Frequency Response) para evitar apagones. ZypyZape permite a los parques eólicos <strong>entrar y monetizar este mercado hiper-rentable</strong>.
                  </p>
                </div>

                <div className="bg-white p-10 rounded-[2rem] shadow-lg border-t-4 border-emerald-500 relative overflow-hidden group hover:-translate-y-2 transition-transform duration-300">
                  <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-6 relative z-10">
                    <Icons.Power />
                  </div>
                  <h3 className="text-2xl font-bold text-slate-900 mb-4 relative z-10">El Relevo Definitivo de la Nuclear</h3>
                  <p className="text-slate-600 leading-relaxed relative z-10">
                    El único gran argumento técnico a favor de las centrales nucleares es que sus enormes turbinas pesadas aportan la "inercia base" que sostiene la red. <strong>ZypyZape aporta esa misma inercia mecánicamente con el viento.</strong> Es la pieza final para jubilar la energía nuclear.
                  </p>
                </div>
              </div>

              <div className="bg-slate-900 rounded-[3rem] p-12 text-center shadow-2xl">
                <h3 className="text-3xl font-black text-white mb-6">De Vender Viento a Vender Seguridad</h3>
                <p className="text-slate-400 max-w-3xl mx-auto text-lg leading-relaxed mb-8">
                  La energía eólica dejará de ser el "problema" que los operadores de red deben gestionar, para convertirse en la <strong>solución principal</strong> que mantiene vivas las ciudades y la industria.
                </p>
                <button onClick={() => setCurrentPage('home')} className="bg-gradient-to-r from-teal-400 to-emerald-500 hover:from-teal-300 hover:to-emerald-400 text-slate-900 font-black px-10 py-4 rounded-full uppercase tracking-widest transition-all shadow-[0_0_20px_rgba(16,185,129,0.4)]">
                  Debatir Impacto con el Asesor
                </button>
              </div>
            </div>
          );

          const renderInercia = () => (
            <div className="space-y-12 animate-in fade-in duration-700">
              <div className="text-center max-w-4xl mx-auto space-y-6">
                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-teal-100 text-teal-800 font-bold text-xs uppercase tracking-widest mb-2">Física Aplicada</div>
                <h2 className="text-4xl md:text-5xl font-black text-slate-900">El Secreto: <span className="text-teal-600">La Inercia de Fase</span></h2>
                <p className="text-lg text-slate-600 leading-relaxed">
                  Durante décadas, la industria eólica ha perseguido molinos más grandes para atrapar más viento. En ZypyZape nos dimos cuenta de que el secreto no está en la fuerza bruta del aire, sino en la **conservación del movimiento**.
                </p>
              </div>

              <div className="grid md:grid-cols-3 gap-8">
                <div className="bg-white p-8 rounded-3xl shadow-sm border border-teal-50">
                  <div className="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mb-6"><Icons.Activity /></div>
                  <h3 className="text-xl font-bold mb-4">Resonancia Constante</h3>
                  <p className="text-slate-600 text-sm">Nuestros sistemas se sincronizan con las frecuencias naturales del entorno. El molino no lucha contra las rachas, "baila" con ellas, conservando la energía rotacional incluso cuando el viento disminuye.</p>
                </div>
                <div className="bg-white p-8 rounded-3xl shadow-sm border border-teal-50">
                  <div className="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mb-6"><Icons.Zap /></div>
                  <h3 className="text-xl font-bold mb-4">Eficiencia sin Fricción</h3>
                  <p className="text-slate-600 text-sm">Al mantener una Inercia de Fase perfecta, los componentes mecánicos sufren menos estrés. El molino gira más libre, produciendo más kilovatios hora (kWh) por cada ráfaga capturada.</p>
                </div>
                <div className="bg-white p-8 rounded-3xl shadow-sm border border-teal-50">
                  <div className="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mb-6"><Icons.Leaf /></div>
                  <h3 className="text-xl font-bold mb-4">Menor Tamaño, Mayor Impacto</h3>
