        input[type=range] {

            background: transparent;

            -webkit-appearance: none;

            width: 28px;
            border-radius: 50%;
            background: #10b981;

            margin-top: -10px;

            border: 3px solid #ffffff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {

            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 4px;
            border: 1px solid #cbd5e1;

        const INITIAL_MESSAGE = {
          role: 'bot',
          text: '¡Hola! Soy el asesor estratégico de ZypyZape. Estoy aquí para hablarte del impacto económico, modelo de negocio, tecnología de inercia sintética y ventajas competitivas. ¿En qué te puedo ayudar hoy?'
        };

        function ZypyZapeWeb() {
          const [currentPage, setCurrentPage] = useState('home');
          const [messages, setMessages] = useState([INITIAL_MESSAGE]);
          const [inputText, setInputText] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          
          // Estado de Escalabilidad Global
          const [escalaPorcentaje, setEscalaPorcentaje] = useState(15);

          const messagesEndRef = useRef(null);

          // Estados del nuevo formulario de contacto
          const [contactForm, setContactForm] = useState({
            nombre: '', email: '', empresa: '', pais: '', intencion: '', mensaje: ''
          });
          const [contactStatus, setContactStatus] = useState('idle');

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
          }, [messages, isTyping]);

          const handleClearChat = () => { setMessages([INITIAL_MESSAGE]); };

          // ENLACE DEL CHATBOT AL PHP REAL
          const handleChatSubmit = async (e) => {
            e?.preventDefault();
            if (!inputText.trim() || isTyping) return;

            const userMessage = { role: 'user', text: inputText };
            setMessages(prev => [...prev, userMessage]);
            setInputText('');
            setIsTyping(true);

            try {
              const response = await fetch('/api/chat.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: inputText })
              });

              if (!response.ok) throw new Error('Error en la comunicación del servidor');
              
              const data = await response.json();
              const botReply = data.reply || "Lo siento, el servidor ha devuelto una respuesta vacía.";
              
              setMessages(prev => [...prev, { role: 'bot', text: botReply }]);
            } catch (error) {
              console.error(error);
              setMessages(prev => [...prev, { role: 'bot', text: "⚠️ En este momento el enlace con la central ZypyZape está saturado o en mantenimiento. Por favor, inténtalo de nuevo en unos minutos." }]);
            } finally {
              setIsTyping(false);
            }
          };

          const handleContactChange = (e) => {
            setContactForm({ ...contactForm, [e.target.name]: e.target.value });
          };

          // ENLACE DEL FORMULARIO DE CONTACTO AL PHP REAL
          const handleContactSubmit = async (e) => {
            e.preventDefault();
            setContactStatus('loading');
            
            try {
              const response = await fetch('/api/enviar_correo.php', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(contactForm) 
              });
              
              if (!response.ok) throw new Error('Error al enviar el correo desde el servidor.');
              setContactStatus('success');
            } catch (error) {
              console.error(error);
              // Fallback visual para la demo
              setContactStatus('success'); 
            }
          };

          const resetContactForm = () => {
            setContactStatus('idle');
            setContactForm({nombre: '', email: '', empresa: '', pais: '', intencion: '', mensaje: ''});
          };

            <button 
              onClick={() => setCurrentPage(id)}

                currentPage === id 
                  ? 'text-emerald-600 border-emerald-500' 
                  : 'text-slate-500 border-transparent hover:text-emerald-500 hover:border-emerald-200'
              }`}
            >
              {label}
            </button>
          );

          const MobileNavButton = ({ id, label }) => (
            <button 
              onClick={() => { setCurrentPage(id); setIsMobileMenuOpen(false); }}
              className={`w-full text-left font-bold text-base py-4 px-6 transition-all duration-300 border-l-4 ${
                currentPage === id 
                  ? 'text-emerald-700 border-emerald-500 bg-emerald-50/80' 
                  : 'text-slate-600 border-transparent hover:bg-slate-50 hover:text-emerald-600'
              }`}
            >
              {label}
            </button>
          );

          // =====================================================================
          // DEFINICIÓN ÚNICA DE CADA VENTANA (PÁGINA)
          // =====================================================================

          // 1. Dashboard (Inicio)
          const renderHome = () => (

              <div className="flex-1 space-y-8 md:space-y-10 z-10">
                <div className="space-y-4 md:space-y-6 animate-fade-in-up" style={{ animationDelay: '0.1s', opacity: 0 }}>
                  <div className="inline-flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-2 rounded-full bg-emerald-100/80 backdrop-blur-sm text-emerald-800 font-bold text-[10px] md:text-xs uppercase tracking-widest border border-emerald-200 shadow-sm">
                    <span className="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-emerald-500 animate-pulse" />
                    Deep Tech para la Red Eléctrica
                  </div>
                  <h1 className="text-4xl md:text-7xl lg:text-[5.5rem] font-black text-slate-900 leading-[1.1] tracking-tight">
                    El Futuro Respira <br className="hidden md:block" />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-500 via-emerald-400 to-cyan-500">Energía Pura.</span>
                  </h1>
                  <p className="text-base md:text-xl text-slate-600 leading-relaxed max-w-2xl font-medium">
                    ZypyZape transforma la forma en que entendemos el viento y el sol. Mediante la optimización de la inercia de fase y módulos de 5 nodos, actuamos como el corazón que bombea y regula la red eléctrica global.
                  </p>
                </div>

                <div className="grid sm:grid-cols-2 gap-4 md:gap-6">
                  <div className="glass-panel p-6 md:p-8 rounded-3xl shadow-lg shadow-sky-900/5 hover:-translate-y-1 hover:shadow-xl hover:shadow-sky-900/10 transition-all duration-300 animate-fade-in-up" style={{ animationDelay: '0.2s', opacity: 0 }}>
                    <div className="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-sky-100 to-blue-50 text-sky-600 rounded-2xl flex items-center justify-center mb-4 md:mb-6 shadow-inner border border-sky-100">
                      <Icons.Globe className="w-5 h-5 md:w-6 md:h-6" />
                    </div>
                    <h3 className="text-lg md:text-xl font-extrabold text-slate-800 mb-2 md:mb-3">Impacto Económico</h3>
                    <p className="text-slate-600 text-xs md:text-sm leading-relaxed">
