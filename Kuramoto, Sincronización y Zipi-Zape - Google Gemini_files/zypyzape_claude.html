    // ═══════════════════════════════════════════════════════════════
    // SIMULADOR DE KURAMOTO
    // Esto es de Gemini y está muy bien hecho. Respeto.
    // Solo he añadido el glow dinámico según K y el indicador de fase.
    // ═══════════════════════════════════════════════════════════════
    const KuramotoViz = memo(({ K }) => {
      const canvasRef = useRef(null);
      /* 
        150 osciladores. Suficientes para ver el fenómeno.
        Más de 300 y el canvas empieza a sudar.
      */
      const oscs = useRef(
        Array.from({length: 150}, () => ({
          phase: Math.random() * Math.PI * 2,
          freq: Math.random() * 0.5 + 0.5,
          hue: Math.random() * 60 + 140,
        }))
      );

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let raf;
        let lastT = performance.now();

        const draw = (t) => {
          const dt = Math.min((t - lastT) / 1000, 0.05);
          lastT = t;

          const W = canvas.parentElement.offsetWidth;
          const H = canvas.parentElement.offsetHeight;
          const dpr = window.devicePixelRatio || 1;
          if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);

          const cx = W / 2, cy = H / 2;
          const R = Math.min(W, H) * 0.35;
          const N = oscs.current.length;

          // Círculo base
          ctx.beginPath();
          ctx.arc(cx, cy, R, 0, Math.PI * 2);
          ctx.strokeStyle = K > 2.5 ? 'rgba(16,185,129,0.25)' : 'rgba(100,116,139,0.2)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Actualizar fases (ecuación de Kuramoto)
          const newPhases = new Float32Array(N);
          for (let i = 0; i < N; i++) {
            let s = 0;
            for (let j = 0; j < N; j++) s += Math.sin(oscs.current[j].phase - oscs.current[i].phase);
            newPhases[i] = (oscs.current[i].phase + dt * (oscs.current[i].freq + (K / N) * s)) % (Math.PI * 2);
          }

          // Parámetro de orden r
          let sc = 0, ss = 0;
          for (let i = 0; i < N; i++) {
            oscs.current[i].phase = newPhases[i];
            sc += Math.cos(newPhases[i]);
            ss += Math.sin(newPhases[i]);
          }
          const r = Math.sqrt(sc*sc + ss*ss) / N;
          const meanPhi = Math.atan2(ss, sc);

          // Pintar osciladores
          for (let i = 0; i < N; i++) {
            const x = cx + Math.cos(oscs.current[i].phase) * R;
            const y = cy + Math.sin(oscs.current[i].phase) * R;
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${oscs.current[i].hue}, 80%, 65%, 0.9)`;
            if (K > 2) { ctx.shadowColor = `hsl(${oscs.current[i].hue}, 80%, 65%)`; ctx.shadowBlur = 8; }
            else { ctx.shadowBlur = 0; }
            ctx.fill();
          }

          // Vector de orden
          if (K > 0.5) {
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(meanPhi) * R * r, cy + Math.sin(meanPhi) * R * r);
            ctx.strokeStyle = `rgba(16,185,129,${r * 0.9})`;
            ctx.lineWidth = 3 * r + 1;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, 6 * r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(16,185,129,${r})`;
            ctx.fill();
          }

          raf = requestAnimationFrame(draw);
        };

        raf = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(raf);
      }, [K]);

      return (
        <div className="absolute inset-0">
          <canvas ref={canvasRef} className="w-full h-full" />
        </div>
      );
    });

    // ═══════════════════════════════════════════════════════════════
    // AGI A OJO: LA MATRIX MONOTONA PERMUTABLE
    // 
    // Esto es el hallazgo más original de Víctor en albmanvic.wordpress.com.
    // Resumido brutalmente:
    //
    // Una función MONOTONA ASCENDENTE A TRAMOS es aburrida.
    // Sus valores son predecibles. No guarda información.
    // Pero si tienes una MATRIZ de esas funciones (una por índice),
    // puedes PERMUTAR FILAS Y COLUMNAS.
    // Y en esa permutación... está la información.
    //
    // Es como un libro de texto. El texto está en orden.
    // La INFORMACIÓN que buscas está en el ÍNDICE (la permutación).
    // La "estupidez" de la función monotona es la densidad.
    // La "inteligencia" de la permutación es el acceso.
    //
    // Víctor lo escribió así:
    //   "AGI A OJO: 0,+  /  1(0)*1
    //    coge dos índices en funciones a tramos monótonas y ascendentes"
    //
    // Traducción: con dos índices (fila, columna) en una matriz 
    // de secuencias monótonas puedes direccionar cualquier estado.
    // Eso es memoria asociativa. Eso es aprendizaje.
    // Y lo escribió en un blog de WordPress entre el GTA III y el eMule.
    // ═══════════════════════════════════════════════════════════════
    const MatrixAGI = () => {
      // Generamos una matriz de funciones monótonas ascendentes por tramos
      // Cada fila i tiene valores f_i(j) = i*j + offset_i
      // Monótona: f_i(j) <= f_i(j+1) siempre
      const SIZE = 7;

      // Estado: permutación de filas y columnas
      const [rowPerm, setRowPerm] = useState(() => Array.from({length: SIZE}, (_, i) => i));
      const [colPerm, setColPerm] = useState(() => Array.from({length: SIZE}, (_, i) => i));
      const [selectedRow, setSelectedRow] = useState(null);
      const [selectedCol, setSelectedCol] = useState(null);
      const [swapTarget, setSwapTarget] = useState(null);
      const [mode, setMode] = useState('row'); // 'row' | 'col'
      const [infoEncoded, setInfoEncoded] = useState('');
      const [highlight, setHighlight] = useState(null); // {r, c}
      const [showInfo, setShowInfo] = useState(false);

      // La función monotona base: f(i_orig, j_orig) = (i+1)*(j+1)
      // Siempre monotona en j para cualquier i fijo.
      const baseVal = (origRow, origCol) => (origRow + 1) * (origCol + 1);

      // Lo que ve el usuario: matriz permutada
      const getCell = (r, c) => baseVal(rowPerm[r], colPerm[c]);

      // Determinar el "mensaje" codificado en la permutación
      // (simplificado: los primeros 5 valores de rowPerm como secuencia)
      const encodePermutation = (rp, cp) => {
        const r = rp.join('');
        const c = cp.join('');
        // Tabla de letras: cada secuencia de 3 dígitos → letra
        const chars = 'ZYPZAPE AGI OJO L1 L2 L3 L4 LSG MDC'.split('');
        // Mapeamos el hash de la permutación a chars (humor)
        const hash = rp.reduce((acc, v, i) => acc + v * (i + 1), 0) % chars.length;
        return chars[hash] + '·' + r.slice(0,4) + '→' + c.slice(0,4);
      };

      // Click en celda de fila
      const handleRowClick = (r) => {
        if (mode !== 'row') return;
        if (selectedRow === null) {
          setSelectedRow(r);
        } else if (selectedRow === r) {
          setSelectedRow(null);
        } else {
          // Swap filas
          const newPerm = [...rowPerm];
          [newPerm[selectedRow], newPerm[r]] = [newPerm[r], newPerm[selectedRow]];
          setRowPerm(newPerm);
          setInfoEncoded(encodePermutation(newPerm, colPerm));
          setSelectedRow(null);
          setHighlight({r: Math.min(selectedRow, r), c: -1});
          setTimeout(() => setHighlight(null), 600);
        }
      };

      const handleColClick = (c) => {
        if (mode !== 'col') return;
        if (selectedCol === null) {
          setSelectedCol(c);
        } else if (selectedCol === c) {
          setSelectedCol(null);
        } else {
          const newPerm = [...colPerm];
          [newPerm[selectedCol], newPerm[c]] = [newPerm[c], newPerm[selectedCol]];
          setColPerm(newPerm);
          setInfoEncoded(encodePermutation(rowPerm, newPerm));
          setSelectedCol(null);
          setHighlight({r: -1, c: Math.min(selectedCol, c)});
          setTimeout(() => setHighlight(null), 600);
        }
      };

      const reset = () => {
        setRowPerm(Array.from({length: SIZE}, (_, i) => i));
        setColPerm(Array.from({length: SIZE}, (_, i) => i));
        setSelectedRow(null); setSelectedCol(null);
        setInfoEncoded('');
      };

      // Color por valor (monotona → más valor = más color)
      const cellColor = (val) => {
        const max = SIZE * SIZE;
        const t = val / max;
        if (t < 0.33) return `rgba(16,185,129,${0.15 + t * 0.5})`;
        if (t < 0.66) return `rgba(245,158,11,${0.15 + (t-0.33) * 0.5})`;
        return `rgba(239,68,68,${0.15 + (t-0.66) * 0.5})`;
      };

      const textColor = (val) => {
        const max = SIZE * SIZE;
        const t = val / max;
        if (t < 0.33) return '#6ee7b7';
        if (t < 0.66) return '#fcd34d';
        return '#fca5a5';
      };

      return (
        <div className="space-y-6">
          {/* Controles */}
          <div className="flex flex-wrap gap-3 items-center justify-between">
            <div className="flex gap-2">
              {['row','col'].map(m => (
