    // ═══════════════════════════════════════════════════════════════
    // SIMULADOR DE KURAMOTO
    // Esto es de Gemini y está muy bien hecho. Respeto.
    // Solo he añadido el glow dinámico según K y el indicador de fase.
    // ═══════════════════════════════════════════════════════════════
    const KuramotoViz = memo(({ K }) => {
      const canvasRef = useRef(null);
      const oscs = useRef(
        Array.from({length: 150}, () => ({
          phase: Math.random() * Math.PI * 2,
          freq: Math.random() * 0.5 + 0.5,
          hue: Math.random() * 60 + 140,
        }))
      );

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let raf;
        let lastT = performance.now();

        const draw = (t) => {
          const dt = Math.min((t - lastT) / 1000, 0.05);
          lastT = t;

          const W = canvas.parentElement.offsetWidth;
          const H = canvas.parentElement.offsetHeight;
          const dpr = window.devicePixelRatio || 1;
          if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);

          const cx = W / 2, cy = H / 2;
          const R = Math.min(W, H) * 0.35;
          const N = oscs.current.length;

          // Círculo base
          ctx.beginPath();
          ctx.arc(cx, cy, R, 0, Math.PI * 2);
          ctx.strokeStyle = K > 2.5 ? 'rgba(16,185,129,0.25)' : 'rgba(100,116,139,0.2)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Actualizar fases (ecuación de Kuramoto)
          const newPhases = new Float32Array(N);
          for (let i = 0; i < N; i++) {
            let s = 0;
            for (let j = 0; j < N; j++) s += Math.sin(oscs.current[j].phase - oscs.current[i].phase);
            newPhases[i] = (oscs.current[i].phase + dt * (oscs.current[i].freq + (K / N) * s)) % (Math.PI * 2);
          }

          // Parámetro de orden r
          let sc = 0, ss = 0;
          for (let i = 0; i < N; i++) {
            oscs.current[i].phase = newPhases[i];
            sc += Math.cos(newPhases[i]);
            ss += Math.sin(newPhases[i]);
          }
          const r = Math.sqrt(sc*sc + ss*ss) / N;
          const meanPhi = Math.atan2(ss, sc);

          // Pintar osciladores
          for (let i = 0; i < N; i++) {
            const x = cx + Math.cos(oscs.current[i].phase) * R;
            const y = cy + Math.sin(oscs.current[i].phase) * R;
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${oscs.current[i].hue}, 80%, 65%, 0.9)`;
            if (K > 2) { ctx.shadowColor = `hsl(${oscs.current[i].hue}, 80%, 65%)`; ctx.shadowBlur = 8; }
            else { ctx.shadowBlur = 0; }
            ctx.fill();
          }

          // Vector de orden
          if (K > 0.5) {
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(meanPhi) * R * r, cy + Math.sin(meanPhi) * R * r);
            ctx.strokeStyle = `rgba(16,185,129,${r * 0.9})`;
            ctx.lineWidth = 3 * r + 1;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, 6 * r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(16,185,129,${r})`;
            ctx.fill();
          }

          raf = requestAnimationFrame(draw);
        };

        raf = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(raf);
      }, [K]);

      return (
        <div className="absolute inset-0">
          <canvas ref={canvasRef} className="w-full h-full" />
        </div>
      );
    });

    // AGI A OJO: LA MATRIX MONOTONA PERMUTABLE
    // Esto es el hallazgo más original de Víctor en albmanvic.wordpress.com.
    // Una función MONOTONA ASCENDENTE A TRAMOS es aburrida.
    // Pero si tienes una MATRIZ de esas funciones,
    // puedes PERMUTAR FILAS Y COLUMNAS. La permutación es la información.
    // ═══════════════════════════════════════════════════════════════
    const MatrixAGI = () => {
      const SIZE = 7;
      const [rowPerm, setRowPerm] = useState(() => Array.from({length: SIZE}, (_, i) => i));
      const [colPerm, setColPerm] = useState(() => Array.from({length: SIZE}, (_, i) => i));
      const [selectedRow, setSelectedRow] = useState(null);
      const [selectedCol, setSelectedCol] = useState(null);
      const [mode, setMode] = useState('row');
      const [info, setInfo] = useState('');
      const [showHelp, setShowHelp] = useState(false);

      const baseVal = (or, oc) => (or + 1) * (oc + 1);
      const getCell = (r, c) => baseVal(rowPerm[r], colPerm[c]);
      const encPerm = (rp, cp) => {
        const words='ZYPZAPE AGI OJO L1 L2 L3 L4 LSG MDC'.split(' ');
        const h=rp.reduce((a,v,i)=>a+v*(i+1),0)%words.length;
        return words[h]+' · '+rp.join('').slice(0,4)+'→'+cp.join('').slice(0,4);
      };
      const handleRow = (r) => {
        if (mode !== 'row') return;
        if (selectedRow === null) setSelectedRow(r);
        else if (selectedRow === r) setSelectedRow(null);
        else {
          const p = [...rowPerm]; [p[selectedRow], p[r]] = [p[r], p[selectedRow]];
          setRowPerm(p); setInfo(encPerm(p, colPerm)); setSelectedRow(null);
        }
      };
      const handleCol = (c) => {
        if (mode !== 'col') return;
        if (selectedCol === null) setSelectedCol(c);
        else if (selectedCol === c) setSelectedCol(null);
        else {
          const p = [...colPerm]; [p[selectedCol], p[c]] = [p[c], p[selectedCol]];
          setColPerm(p); setInfo(encPerm(rowPerm, p)); setSelectedCol(null);
        }
      };
      const reset = () => { setRowPerm(Array.from({length:SIZE},(_,i)=>i)); setColPerm(Array.from({length:SIZE},(_,i)=>i)); setSelectedRow(null); setSelectedCol(null); setInfo(''); };
      const cellBg = (v) => {
        const t=v/(SIZE*SIZE);
        if (t<0.33) return `rgba(16,185,129,${0.08+t*0.35})`;
        if (t<0.66) return `rgba(245,158,11,${0.08+(t-0.33)*0.35})`;
        return `rgba(239,68,68,${0.08+(t-0.66)*0.35})`;
      };
      const cellTx = (v) => {
        const t=v/(SIZE*SIZE);
        if (t<0.33) return '#6ee7b7';
        if (t<0.66) return '#fcd34d';
        return '#fca5a5';
      };
      return (
        <div className="space-y-6">
          <div className="flex flex-wrap gap-3 items-center justify-between pb-5 border-b" style={{borderColor:'rgba(255,255,255,0.07)'}}>
            <div className="flex gap-3">
              {['row','col'].map(m=>(
                <button key={m} onClick={()=>{setMode(m);setSelectedRow(null);setSelectedCol(null);}}
                  className={`pill transition-all ${mode===m
                    ? m==='row'?'bg-emerald-900/50 text-emerald-300 border border-emerald-600':'bg-amber-900/50 text-amber-300 border border-amber-600'
                    : 'text-gray-400 border'}`}
                  style={mode!==m?{borderColor:'rgba(255,255,255,0.1)'}:{}}>
                  {m==='row'?'↕ Filas':'↔ Columnas'}
                </button>
              ))}
            </div>
            <div className="flex gap-3">
              <button onClick={reset} className="pill text-gray-400 border transition-all hover:text-gray-200"
                style={{borderColor:'rgba(255,255,255,0.1)'}}>↺ Reset</button>
              <button onClick={()=>setShowHelp(!showHelp)} className="pill text-amber-400 border border-amber-700/50 bg-amber-900/20 hover:bg-amber-900/40 transition-all">ℹ︎ Idea</button>
            </div>
          </div>
          {showHelp && (
            <div className="p-5 rounded-2xl border text-sm space-y-2" style={{background:'rgba(245,158,11,0.07)',borderColor:'rgba(245,158,11,0.25)'}}>
              <p style={{color:'#fcd34d'}} className="font-bold">La idea de Víctor (albmanvic.wordpress.com)</p>
              <p style={{color:'#d4a03a'}}>Cada fila es <code className="mono-text text-xs bg-amber-900/30 px-1 rounded">f_i(j) = (i+1)·(j+1)</code> — monótona, aburrida, predecible. No guarda información.</p>
              <p style={{color:'#d4a03a'}}>Pero la <strong>permutación de filas y columnas</strong> sí guarda información. El orden de acceso <em>es</em> el mensaje. La "estupidez" del entrenamiento masivo + la "inteligencia" del acceso = AGI.</p>
              <p className="mono-text text-xs" style={{color:'#92710a'}}>Escrito entre el GTA III y el eMule. Sin broma.</p>
            </div>
          )}
          <div className="overflow-x-auto">
            <div className="inline-block p-6 rounded-2xl border" style={{background:'rgba(4,11,24,0.8)',borderColor:'rgba(255,255,255,0.06)'}}>
              <div className="flex gap-1.5 mb-1.5 ml-10">
                {Array.from({length:SIZE},(_,c)=>(
                  <div key={c} onClick={()=>handleCol(c)}
                    className={`matrix-cell text-[0.6rem] font-bold ${mode==='col'?'cursor-pointer':'cursor-default'}
                      ${selectedCol===c?'ring-2 ring-amber-400':'text-gray-500'}`}
                    style={{background:selectedCol===c?'rgba(245,158,11,0.15)':'rgba(255,255,255,0.03)',color:selectedCol===c?'#fbbf24':'#6b7fa3'}}>
                    c{colPerm[c]}
                  </div>
                ))}
              </div>
              {Array.from({length:SIZE},(_,r)=>(
                <div key={r} className="flex gap-1.5 mb-1.5">
                  <div onClick={()=>handleRow(r)}
                    className={`matrix-cell w-9 text-[0.6rem] font-bold ${mode==='row'?'cursor-pointer':'cursor-default'}
                      ${selectedRow===r?'ring-2 ring-emerald-400':''}`}
                    style={{background:selectedRow===r?'rgba(16,185,129,0.15)':'rgba(255,255,255,0.03)',color:selectedRow===r?'#34d399':'#6b7fa3'}}>
                    r{rowPerm[r]}
                  </div>
                  {Array.from({length:SIZE},(_,c)=>{
                    const v=getCell(r,c);
                    return (
                      <div key={c} className={`matrix-cell transition-all ${selectedRow===r||selectedCol===c?'scale-105 font-bold':''}`}
                        style={{background:cellBg(v),color:cellTx(v)}}>
                        {v}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
          <div className="flex items-center gap-4 p-4 rounded-xl" style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)'}}>
            <span className="mono-text text-xs uppercase tracking-widest" style={{color:'#6b7fa3'}}>Info latente:</span>
            <code className="mono-text text-sm font-bold" style={{color:info?'#c9a84c':'#4a5568'}}>{info||'< permuta para codificar >'}</code>
            {info && <span className="ml-auto mono-text text-xs px-2 py-1 rounded" style={{color:'#6ee7b7',background:'rgba(16,185,129,0.1)'}}>{rowPerm.join('')}|{colPerm.join('')}</span>}
          </div>
          <p className="text-xs text-center" style={{color:'#4a5568'}}>
            {mode==='row'?'Click en etiqueta de fila → click en otra para intercambiarlas':'Click en etiqueta de columna → click en otra para intercambiarlas'}
          </p>
        </div>
      );
    };
