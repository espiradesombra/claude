<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZypyZape Technologies | Inercia de Fase</title>
    <!-- Cargamos React, ReactDOM y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cargamos Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG ---
        const Icons = {
          Wind: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
          Leaf: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>,
          Globe: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>,
          Send: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
          Bot: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>,
          User: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
          Activity: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
          TrendingDown: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>,
          DollarSign: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
          Zap: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
          Power: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>,
          Layers: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 17 22 12"/></svg>,
          Battery: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>,
          Settings: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
          Network: ({ className = "w-6 h-6" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M12 8v4"/></svg>,
          Trash: ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        };

        const INITIAL_MESSAGE = {
          role: 'bot',
          text: '¡Hola! Soy el asesor estratégico de ZypyZape. Estoy aquí para hablarte del impacto económico, la entrada en el mercado de regulación, la jubilación nuclear y nuestra tecnología ecológica. ¿En qué te puedo ayudar hoy?'
        };

        function ZypyZapeWeb() {
          const [currentPage, setCurrentPage] = useState('home');
          const [messages, setMessages] = useState([INITIAL_MESSAGE]);
          const [inputText, setInputText] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const messagesEndRef = useRef(null);

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
          }, [messages, isTyping]);

          const handleClearChat = () => {
            setMessages([INITIAL_MESSAGE]);
          };

          const handleSendMessage = async (e) => {
            e?.preventDefault();
            if (!inputText.trim() || isTyping) return;

            const userMessage = { role: 'user', text: inputText };
            setMessages(prev => [...prev, userMessage]);
            setInputText('');
            setIsTyping(true);

            try {
              // Conexión segura a tu backend en Nominalia
              const response = await fetch('/api/chat.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: inputText })
              });

              if (!response.ok) throw new Error('Error en la comunicación del servidor');
              
              const data = await response.json();
              const botReply = data.reply || "Lo siento, el servidor ha devuelto una respuesta vacía.";
              
              setMessages(prev => [...prev, { role: 'bot', text: botReply }]);
            } catch (error) {
              console.error(error);
              setMessages(prev => [...prev, { role: 'bot', text: "⚠️ En este momento el enlace con la central ZypyZape está saturado. Por favor, inténtalo de nuevo en unos minutos." }]);
            } finally {
              setIsTyping(false);
            }
          };

          const NavButton = ({ id, label }) => (
            <button 
              onClick={() => setCurrentPage(id)}
              className={`font-bold text-xs md:text-sm transition-all duration-300 py-3 px-2 md:px-1 border-b-2 whitespace-nowrap outline-none ${
                currentPage === id 
                  ? 'text-emerald-600 border-emerald-500' 
                  : 'text-slate-500 border-transparent hover:text-emerald-500 hover:border-emerald-200'
              }`}
            >
              {label}
            </button>
          );

          // --- COMPONENTES DE LAS "VENTANAS" (PÁGINAS) ---

          // Ventana 1: Dashboard (Inicio)
          const renderHome = () => (
            <div className="flex flex-col lg:flex-row gap-8 lg:gap-20 items-center">
              <div className="flex-1 space-y-8 md:space-y-10 z-10">
                <div className="space-y-4 md:space-y-6 animate-fade-in-up" style={{ animationDelay: '0.1s', opacity: 0 }}>
                  <div className="inline-flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-2 rounded-full bg-emerald-100/80 backdrop-blur-sm text-emerald-800 font-bold text-[10px] md:text-xs uppercase tracking-widest border border-emerald-200 shadow-sm">
                    <span className="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-emerald-500 animate-pulse" />
                    Visión Estratégica
                  </div>
                  <h1 className="text-4xl md:text-7xl lg:text-[5.5rem] font-black text-slate-900 leading-[1.1] tracking-tight">
                    El Futuro Respira <br className="hidden md:block" />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-500 via-emerald-400 to-cyan-500">Energía Pura.</span>
                  </h1>
                  <p className="text-base md:text-xl text-slate-600 leading-relaxed max-w-2xl font-medium">
                    ZypyZape transforma la forma en que entendemos el viento. Mediante la optimización de la inercia de fase, pasamos de ser meros espectadores climáticos a ser el corazón que bombea y regula la red eléctrica global.
                  </p>
                </div>

                <div className="grid sm:grid-cols-2 gap-4 md:gap-6">
                  <div className="glass-panel p-6 md:p-8 rounded-3xl shadow-lg shadow-sky-900/5 hover:-translate-y-1 hover:shadow-xl hover:shadow-sky-900/10 transition-all duration-300 animate-fade-in-up" style={{ animationDelay: '0.2s', opacity: 0 }}>
                    <div className="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-sky-100 to-blue-50 text-sky-600 rounded-2xl flex items-center justify-center mb-4 md:mb-6 shadow-inner border border-sky-100">
                      <Icons.Globe className="w-5 h-5 md:w-6 md:h-6" />
                    </div>
                    <h3 className="text-lg md:text-xl font-extrabold text-slate-800 mb-2 md:mb-3">Impacto Económico</h3>
                    <p className="text-slate-600 text-xs md:text-sm leading-relaxed">
                      Reducimos drásticamente los costes de estabilización y abrimos la puerta al mercado de regulación, multiplicando las vías de ingresos.
                    </p>
                  </div>
                  
                  <div className="glass-panel p-6 md:p-8 rounded-3xl shadow-lg shadow-emerald-900/5 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-900/10 transition-all duration-300 animate-fade-in-up" style={{ animationDelay: '0.3s', opacity: 0 }}>
                    <div className="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-emerald-100 to-teal-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-4 md:mb-6 shadow-inner border border-emerald-100">
                      <Icons.Leaf className="w-5 h-5 md:w-6 md:h-6" />
                    </div>
                    <h3 className="text-lg md:text-xl font-extrabold text-slate-800 mb-2 md:mb-3">Jubilación Nuclear</h3>
                    <p className="text-slate-600 text-xs md:text-sm leading-relaxed">
                      Proporcionamos la "Inercia Base" que históricamente justificaba a la energía nuclear. Hacemos posible un ecosistema 100% renovable.
                    </p>
                  </div>
                </div>
              </div>

              {/* CHATBOT MEJORADO Y RESPONSIVE */}
              <div className="w-full lg:w-[480px] flex-shrink-0 flex flex-col glass-panel rounded-[2rem] md:rounded-[2.5rem] shadow-2xl shadow-emerald-900/10 border-white/60 overflow-hidden h-[550px] md:h-[650px] z-10 animate-fade-in-up" style={{ animationDelay: '0.4s', opacity: 0 }}>
                <div className="bg-gradient-to-r from-teal-600 to-emerald-500 p-4 md:p-6 text-white shrink-0 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                  <div className="flex items-center justify-between relative z-10">
                    <div className="flex items-center gap-3 md:gap-4">
                      <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center shadow-inner border border-white/20">
                        <Icons.Bot className="w-5 h-5 md:w-6 md:h-6 text-white" />
                      </div>
                      <div>
                        <h2 className="text-base md:text-lg font-bold tracking-wide">Asesor ZypyZape</h2>
                        <p className="text-teal-50 text-[10px] md:text-xs font-medium flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 md:w-2 md:h-2 bg-emerald-300 rounded-full shadow-[0_0_8px_rgba(110,231,183,0.8)] animate-pulse" />
                          Inteligencia en línea
                        </p>
                      </div>
                    </div>
                    <button 
                      onClick={handleClearChat}
                      title="Reiniciar conversación"
                      className="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors border border-transparent hover:border-white/30"
                    >
                      <Icons.Trash className="w-4 h-4 text-white" />
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 md:space-y-6 bg-slate-50/50 chat-scroll">
                  {messages.map((msg, index) => (
                    <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in-up`} style={{animationDuration: '0.4s'}}>
                      <div className={`flex max-w-[90%] md:max-w-[88%] gap-2 md:gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                        <div className={`w-6 h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center shrink-0 shadow-sm ${msg.role === 'user' ? 'bg-gradient-to-br from-slate-200 to-slate-300 text-slate-600' : 'bg-gradient-to-br from-teal-100 to-emerald-100 text-teal-700 border border-teal-200/50'}`}>
                          {msg.role === 'user' ? <Icons.User className="w-3 h-3 md:w-4 md:h-4" /> : <Icons.Bot className="w-3 h-3 md:w-4 md:h-4" />}
                        </div>
                        <div className={`p-3 md:p-4 text-[13px] md:text-[14.5px] leading-relaxed shadow-sm ${
                          msg.role === 'user' 
                            ? 'bg-gradient-to-br from-teal-600 to-emerald-600 text-white rounded-2xl rounded-tr-sm shadow-emerald-900/20' 
                            : 'bg-white border border-slate-100 text-slate-700 rounded-2xl rounded-tl-sm'
                        }`}>
                          {msg.text}
                        </div>
                      </div>
                    </div>
                  ))}
                  {isTyping && (
                    <div className="flex justify-start animate-fade-in-up" style={{animationDuration: '0.3s'}}>
                      <div className="flex gap-2 md:gap-3">
                        <div className="w-6 h-6 md:w-8 md:h-8 rounded-full bg-gradient-to-br from-teal-100 to-emerald-100 text-teal-700 border border-teal-200/50 flex items-center justify-center shrink-0">
                          <Icons.Bot className="w-3 h-3 md:w-4 md:h-4" />
                        </div>
                        <div className="bg-white border border-slate-100 p-3 md:p-4 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-1.5 h-[45px] md:h-[52px]">
                          <span className="w-1.5 h-1.5 md:w-2 md:h-2 bg-teal-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }} />
                          <span className="w-1.5 h-1.5 md:w-2 md:h-2 bg-teal-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }} />
                          <span className="w-1.5 h-1.5 md:w-2 md:h-2 bg-teal-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }} />
                        </div>
                      </div>
                    </div>
                  )}
                  <div ref={messagesEndRef} />
                </div>

                <form onSubmit={handleSendMessage} className="p-3 md:p-4 bg-white/80 backdrop-blur-md border-t border-slate-100 shrink-0">
                  <div className="relative flex items-center group">
                    <input
                      type="text"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      placeholder="Pregunta al asesor..."
                      className="w-full bg-slate-100/50 border border-slate-200 rounded-full py-3 md:py-4 pl-4 md:pl-6 pr-12 md:pr-14 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 focus:bg-white transition-all placeholder:text-slate-400 shadow-inner"
                      disabled={isTyping}
                    />
                    <button
                      type="submit"
                      disabled={!inputText.trim() || isTyping}
                      className="absolute right-1 md:right-2 w-8 h-8 md:w-10 md:h-10 bg-emerald-500 text-white rounded-full flex items-center justify-center hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-95 shadow-md shadow-emerald-500/30"
                    >
                      <Icons.Send className="w-3 h-3 md:w-5 md:h-5" />
                    </button>
                  </div>
                </form>
              </div>
            </div>
          );

          // Ventana 2: Paradigma
          const renderParadigma = () => (
            <div className="space-y-10 md:space-y-16 py-4 md:py-8">
              <div className="text-center max-w-4xl mx-auto space-y-4 md:space-y-6 animate-fade-in-up" style={{ opacity: 0 }}>
                <div className="inline-flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-2 rounded-full bg-indigo-50 text-indigo-700 font-bold text-[10px] md:text-xs uppercase tracking-widest mb-2 border border-indigo-100">
                  Cambio de Reglas de Juego
                </div>
                <h2 className="text-3xl md:text-6xl font-black text-slate-900 leading-tight tracking-tight">
                  De Generador Pasivo a <br className="hidden md:block"/>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-500 to-teal-500">Regulador de Red Activo</span>
                </h2>
                <p className="text-base md:text-xl text-slate-600 leading-relaxed px-4 md:px-0">
                  La industria eólica ha sido históricamente "pasiva". ZypyZape rompe este límite convirtiendo cada molino en una batería de inercia y un escudo cinemático para la red.
                </p>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                <div className="glass-panel p-6 md:p-10 rounded-[2rem] md:rounded-[2.5rem] shadow-xl border-t-[4px] md:border-t-[6px] border-slate-800 hover:-translate-y-2 hover:shadow-2xl transition-all duration-300 animate-fade-in-up" style={{ animationDelay: '0.1s', opacity: 0 }}>
                  <div className="w-12 h-12 md:w-16 md:h-16 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center mb-4 md:mb-6">
                    <Icons.Wind className="w-6 h-6 md:w-8 h-8" />
                  </div>
                  <h3 className="text-lg md:text-2xl font-black text-slate-900 mb-3 md:mb-4">Fin de la Generación Ciega</h3>
                  <p className="text-sm md:text-base text-slate-600 leading-relaxed font-medium">
                    Los molinos convencionales envían energía sucia y fluctuante. Al poseer <strong className="text-slate-900">Inercia de Fase</strong> nativa, entregamos una onda perfecta sin depender de las ráfagas.
